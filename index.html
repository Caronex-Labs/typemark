<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>typemark</title>
    <link rel="icon" href="/docs/assets/logo.svg" type="image/svg+xml">
    <style>
      :root {
        --bg: #fff; --bar: rgba(255,255,255,.78); --fg: #1f2328; --muted: #8b929b; --line: #e7e9ec;
        --pill: #f2f3f5; --pill-on: #1f2328; --pill-on-fg: #fff; --accent: #4183c4; --panel: #f7f8fa;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1e1f22; --bar: rgba(30,31,34,.78); --fg: #e6e6e6; --muted: #858a93; --line: #2f3136;
          --pill: #2b2d31; --pill-on: #e6e6e6; --pill-on-fg: #1e1f22; --accent: #6cb6ff; --panel: #191a1d;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1e1f22; --bar: rgba(30,31,34,.78); --fg: #e6e6e6; --muted: #858a93; --line: #2f3136;
        --pill: #2b2d31; --pill-on: #e6e6e6; --pill-on-fg: #1e1f22; --accent: #6cb6ff; --panel: #191a1d;
      }
      html, body { margin: 0; background: var(--bg); color: var(--fg); }
      body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }

      .bar {
        position: sticky; top: 0; z-index: 10; height: 52px; display: flex; align-items: center; gap: 14px;
        padding: 0 16px; background: var(--bar); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .mark {
        width: 26px; height: 26px; border-radius: 7px; flex: none; display: grid; place-items: center;
        background: linear-gradient(135deg, #6c8cff, #b46cff); color: #fff; font: 700 14px/1 Georgia, serif; box-shadow: 0 2px 8px rgba(108,140,255,.35);
      }
      .doc { min-width: 0; display: flex; align-items: baseline; gap: 10px; }
      #title { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 38vw; }
      #saved { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
      #saved::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #2da44e; transition: background .2s; }
      #saved[data-state="saving"]::before { background: #d4a72c; }
      #saved[data-state="saving"]::after { content: "Saving…"; }
      #saved:not([data-state="saving"])::after { content: "Saved"; }
      .spacer { flex: 1; }
      #stats { color: var(--muted); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }

      .seg { display: inline-flex; background: var(--pill); border-radius: 9px; padding: 3px; gap: 2px; }
      .seg button, .icon-btn {
        font: 500 12.5px/1 inherit; color: var(--fg); background: transparent; border: 0; border-radius: 7px;
        padding: 7px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background .15s, color .15s;
      }
      .seg button:hover, .icon-btn:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
      .seg button[aria-pressed="true"] { background: var(--pill-on); color: var(--pill-on-fg); }
      .icon-btn { background: var(--pill); padding: 7px 9px; }
      .icon-btn svg, .seg svg { width: 15px; height: 15px; }
      #t-theme .sun, #t-theme .moon, #t-theme .auto { display: none; }
      #t-theme[data-theme="light"] .sun, #t-theme[data-theme="dark"] .moon, #t-theme[data-theme="auto"] .auto { display: block; }

      .ai-btn {
        font: 600 12.5px/1 inherit; color: #fff; border: 0; border-radius: 9px; padding: 8px 12px; cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #6c8cff, #b46cff);
        box-shadow: 0 2px 10px rgba(140,110,255,.35); transition: filter .15s, transform .1s;
      }
      .ai-btn:hover { filter: brightness(1.08); } .ai-btn:active { transform: translateY(1px); }
      .ai-btn svg { width: 14px; height: 14px; }
      .ai-btn[aria-busy="true"] { opacity: .7; cursor: progress; }
      .review { display: inline-flex; align-items: center; gap: 2px; font-size: 12.5px; color: var(--muted); background: var(--pill); border-radius: 9px; padding: 3px; }
      .review .icon-btn { background: transparent; white-space: nowrap; padding: 6px 8px; }
      .review .icon-btn:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
      body.reviewing #stats { display: none; }
      .bar > * { flex-shrink: 0; } .doc { flex-shrink: 1; min-width: 140px; } body.reviewing #saved { display: none; } body.reviewing .seg button span { display: none; } body.reviewing #title { max-width: 22vw; }
      .review[hidden] { display: none; }
      #r-count { white-space: nowrap; padding: 0 4px; text-align: center; font-variant-numeric: tabular-nums; }
      .icon-btn { font-size: 12.5px; }
      #agent-status { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
      #agent-status[data-status="connected"]::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #8250df; box-shadow: 0 0 0 3px rgba(130,80,223,.25); }
      main { display: flex; }
      #editor { flex: 1; min-width: 0; }

      .toast {
        position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 20;
        background: var(--pill-on); color: var(--pill-on-fg); padding: 9px 16px; border-radius: 10px;
        font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: up .2s ease-out; transition: opacity .3s;
      }
      .toast.out { opacity: 0; }
      @keyframes up { from { opacity: 0; transform: translate(-50%, 8px); } }
      .skip-link { position: absolute; left: 8px; top: -40px; z-index: 30; padding: 8px 12px; border-radius: 8px; background: var(--pill-on); color: var(--pill-on-fg); }
      .skip-link:focus { top: 8px; }
      .bar svg { pointer-events: none; }
      button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
      @media (max-width: 720px) { #stats, #saved { display: none; } .seg button span { display: none; } }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#editor">Skip to editor</a>
    <header class="bar">
      <div class="mark" aria-hidden="true">T</div>
      <div class="doc"><span id="title">Untitled</span><span id="saved" data-state="saved"></span></div>
      <div class="spacer"></div>
      <span id="stats"></span>
      <div class="review" id="review-pill" hidden>
        <button class="icon-btn" id="r-prev" title="Previous suggestion (Alt+[)" aria-label="Previous suggestion">‹</button>
        <span id="r-count" aria-live="polite"></span>
        <button class="icon-btn" id="r-next" title="Next suggestion (Alt+])" aria-label="Next suggestion">›</button>
        <button class="icon-btn" id="r-accept" title="Accept all suggestions">Accept all</button>
        <button class="icon-btn" id="r-reject" title="Reject all suggestions">Reject all</button>
      </div>
      <div class="seg" role="group" aria-label="View">
        <button id="t-source" aria-pressed="false" title="Show the markdown, in place">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5"/></svg><span>Source</span>
        </button>
        <button id="t-focus" aria-pressed="false" title="Focus mode: fade everything but the current block">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="2.2"/><path d="M2 5.5V3a1 1 0 0 1 1-1h2.5M10.5 2H13a1 1 0 0 1 1 1v2.5M14 10.5V13a1 1 0 0 1-1 1h-2.5M5.5 14H3a1 1 0 0 1-1-1v-2.5"/></svg><span>Focus</span>
        </button>
      </div>
      <button class="icon-btn" id="t-theme" title="Theme" aria-label="Theme">
        <svg class="sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1 1M12 12l1 1M3 13l1-1M12 4l1-1"/></svg>
        <svg class="moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7Z"/></svg>
        <svg class="auto" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12Z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="t-reset" title="Restore the sample document" aria-label="Restore the sample document">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a5.5 5.5 0 1 0 1.7-4M2.5 2.5V5H5"/></svg>
      </button>
    </header>
    <main>
      <div id="editor"></div>
    </main>
    <script type="module" src="/demo/main.ts"></script>
  </body>
</html>
